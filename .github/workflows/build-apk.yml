name: Build release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APK as a GitHub Release with this tag (e.g. v1.0.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sign-translator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sign-translator-apk
          path: app/build/app/outputs/flutter-apk/sign-translator.apk

      # Pushing a tag like v1.0.0, or running this workflow by hand with a release tag,
      # publishes the APK as a GitHub Release.
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Sign Translator ${{ inputs.release_tag || github.ref_name }}
          files: app/build/app/outputs/flutter-apk/sign-translator.apk
