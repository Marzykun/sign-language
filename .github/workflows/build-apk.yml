name: Build release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APK as a GitHub Release with this tag (e.g. v1.0.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Show resolved MediaPipe version
        working-directory: app/android
        continue-on-error: true
        run: ./gradlew -q :app:dependencyInsight --dependency com.google.mediapipe --configuration releaseRuntimeClasspath | head -20

      # Phones with 16 KB memory pages can't load native libraries aligned to 4 KB.
      - name: Check native libraries support 16 KB pages
        run: |
          mkdir -p /tmp/apk && unzip -q -o build/app/outputs/flutter-apk/app-release.apk 'lib/arm64-v8a/*' 'lib/x86_64/*' -d /tmp/apk
          bad=0
          for so in /tmp/apk/lib/*/*.so; do
            for align in $(readelf -lW "$so" | awk '/LOAD/ {print $NF}'); do
              if [ $((align)) -lt 16384 ]; then echo "::error::$so is aligned to $align, needs 0x4000"; bad=1; fi
            done
          done
          exit $bad

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sign-translator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sign-translator-apk
          path: app/build/app/outputs/flutter-apk/sign-translator.apk

      # Pushing a tag like v1.0.0, or running this workflow by hand with a release tag,
      # publishes the APK as a GitHub Release.
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Sign Translator ${{ inputs.release_tag || github.ref_name }}
          files: app/build/app/outputs/flutter-apk/sign-translator.apk
